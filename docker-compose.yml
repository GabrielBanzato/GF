# Stack do Midas. A IA (ouvir, entender e falar) roda no próprio iPhone com
# Apple Intelligence; o servidor só guarda contas, sincronização e planilhas.
#   midas        app + API + dados (SQLite)
#   cloudflared  túnel da Cloudflare (HTTPS)
# No Portainer: Stacks → Add stack → Repository (este repo) e preencha as variáveis.
services:
  midas:
    # A imagem é sempre construída a partir deste repositório (não existe no Docker Hub).
    build: .
    pull_policy: build
    container_name: midas
    restart: unless-stopped
    environment:
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Midas}
      # E-mail do "esqueci minha senha" (https://resend.com). Sem isso o código aparece no log do container.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Midas <onboarding@resend.dev>}
    volumes:
      - midas-data:/app/data   # banco SQLite + planilhas: NÃO apague este volume
    ports:
      - "${MIDAS_PORT:-3210}:3000"

  # Cloudflare Tunnel: crie o túnel em Zero Trust → Networks → Tunnels, cole o
  # token em CLOUDFLARE_TUNNEL_TOKEN e aponte o Public Hostname para HTTP midas:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: midas-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN nas variáveis da stack}
    depends_on:
      - midas

volumes:
  midas-data:
